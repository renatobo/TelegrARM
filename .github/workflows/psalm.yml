name: "Psalm Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for release
        required: false
        type: string
        default: ''

jobs:
  psalm:
    name: Psalm Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: psalm
          coverage: none

      - name: Prepare Psalm paths
        run: mkdir -p temp

      - name: Run Psalm
        run: psalm --output-format=github --no-cache --shepherd --stats
